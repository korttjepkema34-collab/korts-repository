server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache";

    # Keep the existing button URL working while giving relative assets a stable base path.
    location = /assistant.html {
        return 302 /assistant/;
    }

    # The assistant itself remains bound to the server's Tailscale interface. The nginx container
    # reaches that verified address and presents one origin to the browser.
    location /assistant/ {
        proxy_pass http://100.72.202.38:8772/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
