# Server stack. On the Windows server only redis and forgejo run here; Ollama, Syncthing and the
# orchestrator run natively (see docs/06-setup-server.md). On a Linux server you can enable the
# `ollama-in-docker` and `orchestrator-in-docker` profiles.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${SERVER_TS_IP}:6379:6379"
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    restart: unless-stopped
    ports:
      - "${SERVER_TS_IP}:3000:3000"
      - "${SERVER_TS_IP}:2222:22"
    volumes:
      - forgejo:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"

  ollama:
    profiles: ["ollama-in-docker"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${SERVER_TS_IP}:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_NUM_THREADS: "16"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "2"
    # With a GPU on Linux, add nvidia-container-toolkit and:
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }

  orchestrator:
    profiles: ["orchestrator-in-docker"]
    build: ./orchestrator
    restart: unless-stopped
    depends_on: [redis]
    env_file: .env
    environment:
      REDIS_HOST: redis
      REPO_ROOT: /repo
    volumes:
      - ..:/repo
    network_mode: host   # Linux only; needed for wake-on-LAN broadcast

volumes:
  redis:
  forgejo:
  ollama:
